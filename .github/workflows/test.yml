name: Tests
on: pull_request

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: yarn install
      - name: prettier
        run: yarn run prettier --check .

  erblint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Erblint
        run: |
          bundle exec erb_lint --lint-all

  rubocop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Rubocop
        run: |
          bundle exec rubocop

  brakeman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run the brakeman test
        run: |
          gem install brakeman
          brakeman --run-all-checks

  bundle-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run the bundle audit test
        run: |
          gem install bundler-audit
          bundle audit check --update

  rspec:
    runs-on: ubuntu-latest
    env:
      TZ: 'Pacific/Auckland'
      APT_PACKAGES: 'mysql-client libmysqlclient-dev ocrmypdf tesseract-ocr'

    services:
      mysql:
        image: mysql:8.0.28
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Bump the version suffix when APT_PACKAGES changes. ImageVersion is in the key
      # because the cached .debs have to match the apt indexes baked into the image.
      - name: Compute the system packages cache key
        id: apt-key
        run: echo "key=apt-${ImageVersion}-v1" >> "$GITHUB_OUTPUT"

      # Downloading ocrmypdf and its dependencies is ~70MB from the Ubuntu mirrors,
      # which took 4m45s on a bad day, so cache the .debs instead.
      - name: Cache system packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install system packages
        run: |
          mkdir -p ~/apt-archives

          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != 'true' ]; then
            sudo apt-get update
            sudo apt-get install -y --download-only $APT_PACKAGES
            cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          fi

          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install -y --no-download $APT_PACKAGES || {
            echo 'The cached packages are stale, downloading them again'
            sudo apt-get update
            sudo apt-get install -y $APT_PACKAGES
          }

      - name: Verify MySQL connection from host
        run: |
          mysql --host 127.0.0.1 --port ${{ job.services.mysql.ports[3306] }} -uroot -proot -e "SHOW GRANTS FOR 'root'@'localhost'"
          mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql --host 127.0.0.1 --port ${{ job.services.mysql.ports[3306] }} -uroot -proot mysql

      - name: Install deps and create DB
        env:
          MYSQL_PASSWORD: root
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          cp config/application.yml.example config/application.yml
          gem install bundler --version $(tail -n1 Gemfile.lock)
          yarn install
          RAILS_ENV=test bin/rails assets:precompile
          bin/rails db:prepare

      - name: Run RSpec unit tests
        env:
          MYSQL_PASSWORD: root
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bundle exec rspec spec --fail-fast --format=progress
