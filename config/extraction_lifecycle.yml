# Retention numbers for the nightly extraction cleanup.
#
# An extraction is purged when it is older than min_age_months AND either it is
# no longer among the newest keep_latest extractions for its extraction
# definition, or it is older than max_age_months.
#
# Safety exclusions (unfinished jobs, jobs referenced by running work,
# extractions a transformation definition previews from) live in code and are
# deliberately not configurable here.
shared:
  dry_run: true
  batch_limit: 200
  min_age_months: 1
  keep_latest: 24
  max_age_months: 6
  excluded_extraction_definition_ids: []
