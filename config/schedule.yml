# Daily cleanup schedule, loaded by sidekiq-cron on Sidekiq server startup.
# Both jobs land on the low_priority queue, so a Sidekiq process must consume
# it: production has the dedicated low-priority deployment, and staging's
# single process picks it up via the staging :queues: list in
# config/sidekiq.yml. Both workers still honour dry_run in
# config/retention.yml — while that is true, a run only reports.
#
# Jobs here are tagged source: "schedule". The Schedule model creates its own
# cron entries at runtime without a source, and sidekiq-cron only prunes
# entries tagged "schedule", so the two cannot interfere.
extraction_cleanup:
  cron: "15 9 * * * <%= Time.zone.tzinfo.name %>"
  class: "ExtractionCleanupWorker"
  queue: low_priority
  description: "Removes extracted data that has aged out of the retention policy"
preprocess_cleanup:
  cron: "45 9 * * * <%= Time.zone.tzinfo.name %>"
  class: "PreProcessCleanupWorker"
  queue: low_priority
  description: "Removes preprocess block output that has aged out of the retention policy"
