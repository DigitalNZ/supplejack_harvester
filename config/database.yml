default: &default
  adapter:  <%= ENV.fetch('MYSQL_ADAPTER')     { 'mysql2' } %>
  encoding: <%= ENV.fetch('MYSQL_ENCODING')    { 'utf8mb4' } %>
  pool:     <%= ENV.fetch('MYSQL_POOL')        { 5 } %>
  username: <%= ENV.fetch('MYSQL_USER')        { 'root' } %>
  password: <%= ENV.fetch('MYSQL_PASSWORD')    { nil } %>
  host:     <%= ENV.fetch('MYSQL_HOST')        { '127.0.0.1' } %>
  port:     <%= ENV.fetch('MYSQL_PORT')        { 3306 } %>
  socket:   <%= ENV.fetch('MYSQL_SOCKET')      { '/tmp/mysql.sock' } %>
  # When MYSQL_SSLCA is provided, connect over TLS and verify the server's cert
  # against that CA. Otherwise, fall back to config/mysql.cnf, which sets
  # ssl-verify-server-cert=0 because Alpine 3.24's MariaDB Connector/C verifies
  # by default and mysql2 0.5.7 cannot override it via ssl_mode.
<% if ENV['MYSQL_SSLCA'].present? %>
  sslca: <%= ENV['MYSQL_SSLCA'] %>
<% else %>
  default_file:  <%= Rails.root.join('config', 'mysql.cnf') %>
  default_group: 'client'
<% end %>

test:
  <<: *default
  database: <%= ENV.fetch('MYSQL_DATABASE') { 'harvester_test' } %>

development:
  <<: *default
  database: <%= ENV.fetch('MYSQL_DATABASE') { 'harvester_development' } %>

uat:
  <<: *default
  database: <%= ENV.fetch('MYSQL_DATABASE') { 'harvester_uat' } %>

staging:
  <<: *default
  database: <%= ENV.fetch('MYSQL_DATABASE') { 'harvester_staging' } %>

production:
  <<: *default
  database: <%= ENV.fetch('MYSQL_DATABASE') { 'harvester_production' } %>
